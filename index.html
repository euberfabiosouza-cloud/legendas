<style>
  :root {
    --bg: #EEF1F4;
    --surface: #FFFFFF;
    --ink: #1C2430;
    --muted: #5B6675;
    --line: #D5DBE3;
    --accent: #2F5D8C;
    --on-accent: #FFFFFF;
    --mark: #FFE45C;
    --mark-ink: #1C2430;
    --ref-bg: #D3E2F2;
    --error: #B3261E;
    --ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --read: "Source Serif 4", Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  /* Escuro: segue o sistema, a menos que o botão tenha escolhido "claro" */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141A22;
      --surface: #1C2430;
      --ink: #E6EAF0;
      --muted: #93A0B0;
      --line: #2E3946;
      --accent: #8DB7E8;
      --on-accent: #141A22;
      --mark: #E8C547;
      --mark-ink: #141A22;
      --ref-bg: #26405F;
      --error: #F2B8B5;
      color-scheme: dark;
    }
  }
  /* Escuro escolhido pelo botão */
  :root[data-theme="dark"] {
      --bg: #141A22;
      --surface: #1C2430;
      --ink: #E6EAF0;
      --muted: #93A0B0;
      --line: #2E3946;
      --accent: #8DB7E8;
      --on-accent: #141A22;
      --mark: #E8C547;
      --mark-ink: #141A22;
      --ref-bg: #26405F;
      --error: #F2B8B5;
      color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 var(--ui);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  main { max-width: 46rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 0 0 1rem; }
  .top-actions { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: flex-end; }
  h1 { font-size: 1rem; font-weight: 650; margin: 0; color: var(--muted); }
  #theme { display: inline-flex; align-items: center; gap: .4rem; }
  #theme svg { width: 1rem; height: 1rem; }
  body, #q, .field, dialog, .sheet-head { transition: background-color .2s, color .2s; }
  @media (prefers-reduced-motion: reduce) { body, #q, .field, dialog, .sheet-head { transition: none; } }

  .search { position: relative; }
  #q {
    width: 100%;
    font: 400 clamp(1.1rem, 2.5vw, 1.35rem)/1.3 var(--read);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: .55rem .8rem;
  }
  #q::placeholder { color: var(--muted); opacity: .7; }
  #q:focus { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Busca por texto bíblico e filtros */
  .refsearch, .filters { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
  .refsearch { margin-top: .75rem; }
  .filters { margin-top: .6rem; }
  .refsearch .lead { font-size: .9rem; color: var(--muted); margin-right: .25rem; }
  .field {
    font: 400 1rem/1.3 var(--ui); color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: .45rem .6rem; min-width: 0;
  }
  .filters .field { font-size: .9rem; padding: .35rem .5rem; }
  .field::placeholder { color: var(--muted); opacity: .7; }
  .field:focus { outline: 3px solid var(--accent); outline-offset: 2px; }
  .field:disabled { opacity: .55; }
  #book { flex: 1 1 12rem; max-width: 18rem; }
  #folder { max-width: 16rem; }
  #chapter, #verse { width: 5.5rem; text-align: center; }
  .sep { color: var(--muted); font: 600 1.15rem var(--read); }
  .check { display: inline-flex; align-items: center; gap: .4rem; font-size: .9rem; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 1rem; height: 1rem; margin: 0; }
  .check input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem;
    margin: .8rem 0 2rem; font-size: .9rem; color: var(--muted);
  }
  #status { flex: 1 1 14rem; }
  #status.error { color: var(--error); }
  progress { width: 8rem; height: .4rem; accent-color: var(--accent); }
  button.small {
    font: 500 .9rem var(--ui); color: var(--accent); background: none;
    border: 1px solid var(--line); border-radius: 4px; padding: .3rem .7rem; cursor: pointer;
  }
  button.small:disabled { opacity: .5; cursor: default; }
  button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.link {
    font: inherit; color: var(--accent); background: none; border: 0; padding: 0;
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }

  #hint { font-size: .9rem; color: var(--muted); margin: 0 0 1rem; }
  #summary { font-size: .9rem; color: var(--muted); margin: 0 0 .75rem; }
  #summary a { color: var(--accent); margin-left: .35rem; text-underline-offset: 3px; }
  #results { list-style: none; margin: 0; padding: 0; }
  #results li + li { border-top: 1px solid var(--line); }
  .result {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: none; border: 0; color: inherit; font: inherit;
    padding: 1rem .25rem;
  }
  .result:hover .name { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .path { display: block; font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
  .name { display: block; font-weight: 650; font-size: 1.1rem; color: var(--accent); overflow-wrap: anywhere; }
  .count { font-weight: 400; font-size: .85rem; color: var(--muted); margin-left: .4rem; }
  .snippet {

  }
  .time {

  }
  .watch {

  mark {
    color: var(--mark-ink);
    background: linear-gradient(100deg, transparent .15em, var(--mark) .2em, var(--mark) calc(100% - .2em), transparent calc(100% - .15em));

  /* Citação bíblica encontrada */
  mark.ref {
    color: inherit; background: var(--ref-bg);

  .seg { display: inline-flex; }
  .seg button + button { margin-left: -1px; }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  #doc {

  #doc h1 { font-size: 1.7rem; } #doc h2 { font-size: 1.35rem; } #doc h3 { font-size: 1.15rem; }

  ol.top { margin: 0; padding-left: 2.4rem; }
  ol.top li::marker { color: var(--muted); font: .85rem var(--ui); }
  .row {
    display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: .25rem 1rem;
    width: 100%; text-align: left; background: none; border: 0; color: inherit;

  }
  .row:hover > span:first-child { text-decoration: underline; text-underline-offset: 3px; }
  .n { font: 400 .85rem var(--ui); color: var(--muted); }
  .meter {
    grid-column: 1 / -1; height: 3px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--w), var(--line) var(--w));
  }
  #cit-body details { border-bottom: 1px solid var(--line); }
  #cit-body summary { padding: .7rem 0; cursor: pointer; font: 650 1.05rem var(--ui); }
  #cit-body summary .n { float: right; margin-top: .15rem; }
  .chaps { display: grid; gap: .5rem; padding: 0 0 1rem; }
  .chap { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; }
  .chip {
    font: 500 .9rem var(--ui); color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 4px; padding: .2rem .5rem; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .chip small { color: var(--muted); font-weight: 400; font-size: .8rem; margin-left: .35rem; }
  .chip.strong { color: var(--accent); font-weight: 650; }
  .chip:hover { border-color: var(--accent); }

  @media (prefers-reduced-motion: no-preference) {
    dialog[open] { animation: slide .18s ease-out; }
    @keyframes slide { from { transform: translateX(2rem); opacity: 0; } }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Busca nas legendas</h1>
    <div class="top-actions">
      <button id="cit-open" class="small" type="button" disabled>Textos citados</button>
      <button id="theme" class="small" type="button"></button>
    </div>
  </div>
  <div class="search">
    <input id="q" type="search" aria-label="Digite uma palavra ou frase dita no vídeo…" placeholder="Digite uma palavra ou frase dita no vídeo…" autocomplete="off" spellcheck="false" aria-describedby="status">
  </div>
  <div class="refsearch" role="group" aria-label="Texto bíblico citado">
    <span class="lead">Texto bíblico</span>
    <select id="book" class="field" aria-label="Livro da Bíblia">
      <option value="">Qualquer livro</option>
    </select>
    <input id="chapter" class="field" type="text" inputmode="numeric" autocomplete="off" placeholder="Cap." aria-label="Capítulo" disabled>
    <span class="sep" aria-hidden="true">:</span>
    <input id="verse" class="field" type="text" inputmode="numeric" autocomplete="off" placeholder="Vers." aria-label="Versículo" disabled>

  </div>
  <div class="filters" role="group" aria-label="Opções de busca">
    <select id="folder" class="field" aria-label="Pasta" hidden>
      <option value="">Todas as pastas</option>
    </select>
    <label class="check"><input type="checkbox" id="whole"> Palavra inteira</label>
  </div>
  <div class="bar">
    <span id="status" role="status">Carregando…</span>
    <progress id="progress" hidden></progress>
    <button id="login" class="small" hidden>Entrar com Google</button>
    <button id="refresh" class="small" disabled>Atualizar índice</button>
  </div>
  <p id="hint" hidden></p>
  <p id="summary"></p>
  <ul id="results"></ul>
</main>

<dialog id="viewer" aria-labelledby="viewer-title">
  <div class="sheet-head">
    <div>
      <span class="path" id="viewer-path"></span>
      <span class="name" id="viewer-title"></span>
    </div>
    <div class="actions">
      <a id="viewer-watch" class="small" target="_blank" rel="noopener" hidden>Assistir no jw.org</a>
      <a id="viewer-open" class="small" target="_blank" rel="noopener">Abrir no Drive</a>
      <button class="small" id="viewer-close">Fechar</button>
    </div>
  </div>
  <article id="doc"></article>
</dialog>

<dialog id="citations" aria-labelledby="cit-title">
  <div class="sheet-head">
    <div>
      <span class="path" id="cit-scope"></span>
      <span class="name" id="cit-title">Textos citados</span>
    </div>
    <div class="actions">
      <div class="seg" role="group" aria-label="Organizar a lista">
        <button class="small" type="button" data-view="top" aria-pressed="true">Mais citados</button>
        <button class="small" type="button" data-view="books" aria-pressed="false">Por livro</button>
      </div>
      <button class="small" id="cit-close">Fechar</button>
    </div>
  </div>
  <div id="cit-body"></div>
</dialog>

<script>
/* ============================================================
   CONFIGURAÇÃO — edite apenas este bloco
   ============================================================ */
const CONFIG = {
  // ID da pasta raiz no Drive (o trecho depois de /folders/ na URL)
  ROOT_FOLDER_ID: '18d2WDlMOMsSiThYsLUMWB-6I0kySMUnl',

  // Chave de API do Google Cloud (Drive API ativada).
  // Basta ela se a pasta estiver compartilhada como "Qualquer pessoa com o link".
  API_KEY: 'AIzaSyBGios3ixNFjMCbbq-_Q19XAiOMbgTif60',

  // Opcional: Client ID OAuth. Preencha só se a pasta for privada;
  // aí cada visitante entra com a própria conta Google.
  CLIENT_ID: '',

  EXTENSIONS: ['.md', '.markdown'],
  CONCURRENCY: 6,        // downloads simultâneos
  MAX_RESULTS: 200,      // resultados exibidos
  SNIPPETS_PER_FILE: 3,
  TOP_CITATIONS: 100,    // versículos na lista "Mais citados"

  // Idioma dos links para o jw.org (T = português)
  JW_LOCALE: 'T'
};

/* ============================================================ */
const DRIVE = 'https://www.googleapis.com/drive/v3';
const FOLDER = 'application/vnd.google-apps.folder';
const SHORTCUT = 'application/vnd.google-apps.shortcut';
const $ = (s) => document.querySelector(s);
const state = {
  docs: [], indexing: false, results: [], terms: [], ref: null, hintRef: null,
  whole: false, citeCount: 0, pendingFolder: '', citView: 'top'
};
let accessToken = null;

/* ---------- utilidades ---------- */
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ESC[c]);
const plural = (n, um, varios) => `${n.toLocaleString('pt-BR')} ${n === 1 ? um : varios}`;
const isW = (c) => (c >= 97 && c <= 122) || (c >= 48 && c <= 57);   // letra ou dígito (texto já dobrado)

// Minúsculas e sem acentos, preservando o comprimento (posições batem com o texto original)
const foldCache = new Map();
function fold(s) {
  const out = new Array(s.length);
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    let f = foldCache.get(c);
    if (f === undefined) {
      f = (c.normalize('NFD')[0] || c).toLowerCase()[0] || c;
      foldCache.set(c, f);
    }
    out[i] = f;
  }
  return out.join('');
}

async function pool(items, n, fn) {
  let next = 0;
  const worker = async () => { while (next < items.length) { const i = next++; await fn(items[i], i); } };
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));
}

function setStatus(text, { error = false } = {}) {
  const el = $('#status');
  el.textContent = text;
  el.classList.toggle('error', error);
}
function setProgress(done, total) {
  const p = $('#progress');
  if (total == null) { p.hidden = true; return; }
  p.hidden = false; p.max = total; p.value = done;
}

/* ============================================================
   CITAÇÕES BÍBLICAS
   Reconhece no texto: "João 3:16", "Jo 3:16-18", "Mat. 24:14; 28:19, 20",
   "1 Coríntios 13:4", "1Co 13:4", "Salmo 23", "Judas 3",
   "João capítulo 3, versículo 16" e "Salmo 83, versículo 18".
   ============================================================ */
// [nome, capítulos, nomes por extenso, abreviações] (sem acentos, minúsculas)
const BOOKS = [
  ['Gênesis', 50, 'genesis', 'gen|gn'],
  ['Êxodo', 40, 'exodo', 'ex'],
  ['Levítico', 27, 'levitico', 'lev|le|lv'],
  ['Números', 36, 'numeros', 'num|nm'],

  ['Josué', 24, 'josue', 'jos|js'],
  ['Juízes', 21, 'juizes', 'jui|jz'],
  ['Rute', 4, 'rute', 'ru|rt'],
  ['1 Samuel', 31, 'samuel', 'sam|sm'],
  ['2 Samuel', 24, 'samuel', 'sam|sm'],
  ['1 Reis', 22, 'reis', 'rs'],
  ['2 Reis', 25, 'reis', 'rs'],
  ['1 Crônicas', 29, 'cronicas', 'cro|cr'],
  ['2 Crônicas', 36, 'cronicas', 'cro|cr'],
  ['Esdras', 10, 'esdras', 'esd|ed'],
  ['Neemias', 13, 'neemias', 'ne'],
  ['Ester', 10, 'ester', 'est|et'],
  ['Jó', 42, 'jo', ''],
  ['Salmos', 150, 'salmos|salmo', 'sal|sl'],
  ['Provérbios', 31, 'proverbios', 'prov|pro|pv|pr'],
  ['Eclesiastes', 12, 'eclesiastes', 'ecl|ec'],
  ['Cântico de Salomão', 8, 'cantico de salomao|canticos|cantares', 'can|ct'],
  ['Isaías', 66, 'isaias', 'isa|is'],
  ['Jeremias', 52, 'jeremias', 'jer|jr'],
  ['Lamentações', 5, 'lamentacoes', 'lam|lm'],
  ['Ezequiel', 48, 'ezequiel', 'eze|ez'],
  ['Daniel', 12, 'daniel', 'dan|dn'],
  ['Oseias', 14, 'oseias', 'os'],
  ['Joel', 3, 'joel', 'jl'],
  ['Amós', 9, 'amos', 'am'],
  ['Obadias', 1, 'obadias', 'ob'],
  ['Jonas', 4, 'jonas', 'jon|jn'],
  ['Miqueias', 7, 'miqueias', 'miq|mq'],
  ['Naum', 3, 'naum', 'na'],
  ['Habacuque', 3, 'habacuque', 'hab|hc'],
  ['Sofonias', 3, 'sofonias', 'sof|sf'],
  ['Ageu', 2, 'ageu', 'ag'],
  ['Zacarias', 14, 'zacarias', 'zac|zc'],
  ['Malaquias', 4, 'malaquias', 'mal|ml'],
  ['Mateus', 28, 'mateus', 'mat|mt'],
  ['Marcos', 16, 'marcos', 'mar|mc'],
  ['Lucas', 24, 'lucas', 'luc|lc'],
  ['João', 21, 'joao', 'jo'],
  ['Atos', 28, 'atos', 'at'],
  ['Romanos', 16, 'romanos', 'rom|rm'],
  ['1 Coríntios', 16, 'corintios', 'cor|co'],
  ['2 Coríntios', 13, 'corintios', 'cor|co'],
  ['Gálatas', 6, 'galatas', 'gal|gl'],
  ['Efésios', 6, 'efesios', 'efe|ef'],
  ['Filipenses', 4, 'filipenses', 'fil|fp'],
  ['Colossenses', 4, 'colossenses', 'col|cl'],
  ['1 Tessalonicenses', 5, 'tessalonicenses', 'tes|ts'],
  ['2 Tessalonicenses', 3, 'tessalonicenses', 'tes|ts'],
  ['1 Timóteo', 6, 'timoteo', 'tim|tm'],
  ['2 Timóteo', 4, 'timoteo', 'tim|tm'],
  ['Tito', 3, 'tito', 'tt'],
  ['Filêmon', 1, 'filemon', 'filem|fm'],
  ['Hebreus', 13, 'hebreus', 'heb|hb'],

  ['2 Pedro', 3, 'pedro', 'ped|pe'],
  ['1 João', 5, 'joao', 'jo'],
  ['2 João', 1, 'joao', 'jo'],
  ['3 João', 1, 'joao', 'jo'],
  ['Judas', 1, 'judas', 'jd'],
  ['Apocalipse', 22, 'apocalipse', 'apo|ap']
];
const JOB = 18, JOHN = 43;
const ORD = { primeiro: '1', primeira: '1', segundo: '2', segunda: '2', terceiro: '3', terceira: '3' };

const ALIAS = new Map();
const stemSet = new Set();
BOOKS.forEach(([name, , full, abbr], i) => {
  const num = /^[123] /.test(name) ? name[0] : '';
  const add = (list, isAbbr) => list.split('|').filter(Boolean).forEach((stem) => {
    stemSet.add(stem);
    ALIAS.set(num + stem, { b: i + 1, abbr: isAbbr });
  });
  add(full, false);
  add(abbr, true);
});
const STEMS = [...stemSet].sort((a, b) => b.length - a.length).map((s) => s.replace(/ /g, '\\s+')).join('|');

const REF_RE = new RegExp(
  `(?<![a-z0-9])(?:([123])\\s*[ºª]?\\.?\\s*|(primeir[oa]|segund[oa]|terceir[oa])\\s+)?(${STEMS})\\.?(?=\\s*(?:\\d|,?\\s*cap))`, 'g');
// Um número seguido de outro livro ("…3:16, 2 Coríntios…") não é versículo
const NUMBOOK = new RegExp(`\\s*[ºª]?\\.?\\s*(?:${STEMS})\\.?(?=\\s*\\d)`, 'y');
const T = {
  cap: /\s*,?\s*cap(?:itulos?|\.)?\s*(\d{1,3})(?!\d)/y,
  vers: /\s*,?\s*(?:versiculos?|vers\.|vv?\.)\s*(\d{1,3})(?:\s*(?:-|–|—|a|ate|e)\s*(\d{1,3}))?(?!\d)/y,
  cv: /\s*(\d{1,3})(?:\s*:\s*|\.)(\d{1,3})(?:\s*[-–—]\s*(\d{1,3}))?(?![\d:])/y,
  more: /\s*(?:,|e(?=\s))\s*(\d{1,3})(?:\s*[-–—]\s*(\d{1,3}))?(?![\d:]|\.\d)/y,
  semi: /\s*;\s*(?=\d{1,3}(?:\s*:|\.\d))/y,
  bare: /\s*(\d{1,3})(?:\s*[-–—]\s*(\d{1,3}))?(?!\d|\s*:|\.\d|\s*(?:anos?|mes(?:es)?\b|dias?\b|horas?|minutos?|segundos?|vezes|pessoas|mil\b|milh|bilh|%|de\s))/y
};

// Lê capítulos e versículos a partir da posição i (texto já "dobrado")
function parseTail(s, i, book, bareOK) {
  const refs = [];
  const one = book[1] === 1;
  const at = (re) => { re.lastIndex = i; const m = re.exec(s); if (m) i = re.lastIndex; return m; };
  const addMore = (c) => {
    for (;;) {
      const save = i;
      const m = at(T.more);
      if (!m) return;
      NUMBOOK.lastIndex = i;
      if (NUMBOOK.test(s)) { i = save; return; }
      refs.push({ c, c2: c, v1: +m[1], v2: +(m[2] || m[1]) });
    }
  };
  let m;
  if ((m = at(T.cap))) {
    const c = +m[1], v = at(T.vers);
    refs.push(v ? { c, c2: c, v1: +v[1], v2: +(v[2] || v[1]) } : { c, c2: c, v1: 0, v2: 0 });
  } else if ((m = at(T.cv))) {
    for (;;) {
      const c = +m[1];
      refs.push({ c, c2: c, v1: +m[2], v2: +(m[3] || m[2]) });
      addMore(c);
      if (!at(T.semi) || !(m = at(T.cv))) break;
    }
  } else if (bareOK && (m = at(T.bare))) {
    const a = +m[1], z = +(m[2] || m[1]);
    if (one) { refs.push({ c: 1, c2: 1, v1: a, v2: z }); addMore(1); }
    else {
      const v = !m[2] && at(T.vers);
      refs.push(v ? { c: a, c2: a, v1: +v[1], v2: +(v[2] || v[1]) } : { c: a, c2: z, v1: 0, v2: 0 });
    }
  }
  const valid = refs.filter((r) => r.c >= 1 && r.c2 >= r.c && r.c2 <= book[1] &&
    (r.v1 === 0 ? r.v2 === 0 : r.v1 >= 1 && r.v2 >= r.v1 && r.v2 <= 176));
  return valid.length ? { refs: valid, end: i } : null;
}

// Devolve todas as citações do texto: { b, c, c2, v1, v2, start, end }
// (v1 = 0 quando a citação é só do capítulo)
function extractRefs(text, folded = fold(text), { lenient = false } = {}) {
  const out = [];
  REF_RE.lastIndex = 0;
  let m;
  while ((m = REF_RE.exec(folded))) {
    const stem = m[3].replace(/\s+/g, ' ');
    const stemAt = m.index + m[0].lastIndexOf(m[3]);
    let num = m[1] || ORD[m[2]] || '';
    let start = m.index;
    let alias = ALIAS.get(num + stem);
    if (!alias && num) { alias = ALIAS.get(stem); num = ''; start = stemAt; }
    if (!alias) continue;
    let { b, abbr } = alias;
    if (!num && stem === 'jo') {            // "Jó" (livro) × "Jo" (João)
      b = /ó/i.test(text.slice(stemAt, stemAt + 2)) ? JOB : JOHN;
      abbr = b === JOHN;
    }
    // Abreviações só contam com inicial maiúscula ("Is 9:6", não "is 9:6")
    if (abbr && !lenient && text[stemAt] === text[stemAt].toLowerCase()) continue;
    const bareOK = lenient || !abbr || stem.length >= 3;
    const tail = parseTail(folded, m.index + m[0].length, BOOKS[b - 1], bareOK);
    if (!tail) continue;
    for (const r of tail.refs) out.push({ b, ...r, start, end: tail.end });
    REF_RE.lastIndex = tail.end;
  }
  return out;
}

function refMatches(r, q) {
  if (r.b !== q.b) return false;
  if (q.c && (q.c < r.c || q.c > r.c2)) return false;
  if (q.v && !(r.v1 && q.v >= r.v1 && q.v <= r.v2)) return false;
  return true;
}

function refLabel({ b, c, v }) {
  const [name, ch] = BOOKS[b - 1];
  if (ch === 1) return v ? `${name} ${v}` : name;
  if (!c) return name;
  return v ? `${name} ${c}:${v}` : `${name} ${c}`;
}

function jwLink({ b, c, v }) {
  if (!c) return null;
  const pad = (n, w) => String(n).padStart(w, '0');
  const code = pad(b, 2) + pad(c, 3) + (v ? pad(v, 3) : '');
  return `https://www.jw.org/finder?wtlocale=${CONFIG.JW_LOCALE}&prefer=lang&bible=${code}&pub=nwtsty`;
}

/* ============================================================
   MARCAS DE TEMPO E LINK DO VÍDEO
   ============================================================ */
// "00:01:23", "00:01:23.456" (SRT/VTT) ou "[01:23]" / "(1:02:03)"
const TIME_RE = /[\[(](?:(\d{1,2}):)?(\d{1,2}):(\d{2})(?:[.,]\d{1,3})?[\])]|(?<![\d:.])(\d{1,2}):(\d{2}):(\d{2})(?:[.,]\d{1,3})?(?![\d:])/g;
function extractTimes(text) {
  const out = [];
  TIME_RE.lastIndex = 0;
  let m;
  while ((m = TIME_RE.exec(text))) {
    if (/-->\s*$/.test(text.slice(Math.max(0, m.index - 6), m.index))) continue;   // fim da legenda
    const [h, mi, s] = m[2] !== undefined ? [+(m[1] || 0), +m[2], +m[3]] : [+m[4], +m[5], +m[6]];
    if (mi > 59 || s > 59) continue;
    out.push([m.index, h * 3600 + mi * 60 + s]);
  }
  return out;
}
function timeAt(doc, p) {
  const t = doc.times;
  let lo = 0, hi = t.length - 1, ans = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (t[mid][0] <= p) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
  if (ans < 0) return '';
  const sec = t[ans][1], h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  const two = (n) => String(n).padStart(2, '0');
  return h ? `${h}:${two(m)}:${two(s)}` : `${m}:${two(s)}`;
}

// Código do vídeo no nome ou no texto (ex.: pub-jwbvod25_17_VIDEO) ou um link do jw.org no texto
const VIDEO_CODE = /(?<![a-z0-9])((?:pub|docid)-[a-z0-9]+(?:_[a-z0-9]+)*?_video)(?![a-z0-9])/i;
const JW_VIDEO_URL = /https?:\/\/(?:www\.)?jw\.org\/[^\s)<>\]"'`]*(?:videos|lank=|mediaitems)[^\s)<>\]"'`]*/i;
function findVideo(name, content) {
  const code = (name.match(VIDEO_CODE) || content.match(VIDEO_CODE))?.[1];
  if (code) {
    const lank = code.replace(/_video$/i, '_VIDEO');
    return `https://www.jw.org/finder?srcid=jwlshare&wtlocale=${CONFIG.JW_LOCALE}&lank=${encodeURIComponent(lank)}`;
  }
  const url = content.match(JW_VIDEO_URL)?.[0];
  return url ? url.replace(/[.,;:]+$/, '') : null;
}

/* ---------- campos de livro / capítulo / versículo ---------- */
function fillBooks() {

  for (const [label, from, to] of groups) {

function syncRefFields() {

  const ch = $('#chapter'), vs = $('#verse');

  const one = max === 1;

function currentRef() {
  const b = +$('#book').value;
  if (!b) return null;
  const one = BOOKS[b - 1][1] === 1;
  const c = one ? 1 : (parseInt($('#chapter').value, 10) || 0);
  const v = c ? (parseInt($('#verse').value, 10) || 0) : 0;

}

function setRef({ b, c, v }) {

  $('#chapter').value = c && BOOKS[b - 1]?.[1] > 1 ? c : '';
  syncRefFields();

}

/* ---------- opções e pastas ---------- */
function opts() {
  return {
    folder: $('#folder').value || state.pendingFolder || '',
    whole: $('#whole').checked
  };
}
const inFolder = (doc, folder) => !folder || doc.path.startsWith(folder);

function fillFolders() {
  const sel = $('#folder');
  const cur = sel.value || state.pendingFolder;
  const counts = new Map();
  for (const d of state.docs) {
    let acc = '';
    for (const part of d.path.split('/').filter(Boolean)) {
      acc += part + '/';
      counts.set(acc, (counts.get(acc) || 0) + 1);
    }
  }
  const list = [...counts.keys()].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  sel.replaceChildren(new Option('Todas as pastas', ''), ...list.map((p) => {
    const parts = p.slice(0, -1).split('/');
    return new Option('\u2003'.repeat(parts.length - 1) + `${parts.pop()} (${counts.get(p)})`, p);
  }));
  sel.value = counts.has(cur) ? cur : '';
  sel.hidden = !list.length;
  if (state.docs.length) state.pendingFolder = '';
}

/* ---------- armazenamento local (IndexedDB) ---------- */
const store = {
  db: null,
  open() {
    if (this.db) return this.db;
    this.db = new Promise((res, rej) => {
      const r = indexedDB.open('busca-md-drive', 2);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async run(name, mode, fn) {
    try {
      const db = await this.open();
      return await new Promise((res) => {
        const tx = db.transaction(name, mode);
        const req = fn(tx.objectStore(name));
        tx.oncomplete = () => res(req ? req.result : undefined);
        tx.onerror = tx.onabort = () => res(null);
      });
    } catch { return null; }
  },
  all() { return this.run('files', 'readonly', (s) => s.getAll()); },
  put(v) { return this.run('files', 'readwrite', (s) => s.put(v)); },
  getMeta(k) { return this.run('meta', 'readonly', (s) => s.get(k)); },
  putMeta(k, v) { return this.run('meta', 'readwrite', (s) => s.put(v, k)); },
  // Apaga do cache os arquivos que não estão mais no Drive
  prune(keep) {
    return this.run('files', 'readwrite', (s) => {
      const r = s.getAllKeys();
      r.onsuccess = () => { for (const k of r.result) if (!keep.has(k)) s.delete(k); };
    });
  }
};

/* ---------- Google Drive ---------- */
async function driveFetch(url, asText = false) {
  const u = new URL(url);
  const headers = {};
  if (accessToken) headers.Authorization = 'Bearer ' + accessToken;
  else u.searchParams.set('key', CONFIG.API_KEY);
  const r = await fetch(u.toString(), { headers });
  if (!r.ok) {
    let detail = '';
    try { detail = (await r.json()).error?.message || ''; } catch {}
    const err = new Error(`${r.status} ${detail}`.trim());
    err.status = r.status;
    throw err;
  }
  return asText ? r.text() : r.json();
}

async function listChildren(folderId) {
  const files = [];
  let pageToken = '';
  do {
    const u = new URL(DRIVE + '/files');
    u.searchParams.set('q', `'${folderId}' in parents and trashed = false`);
    u.searchParams.set('fields', 'nextPageToken, files(id, name, mimeType, modifiedTime, shortcutDetails)');
    u.searchParams.set('pageSize', '1000');
    u.searchParams.set('supportsAllDrives', 'true');
    u.searchParams.set('includeItemsFromAllDrives', 'true');
    if (pageToken) u.searchParams.set('pageToken', pageToken);
    const data = await driveFetch(u.toString());
    files.push(...(data.files || []));
    pageToken = data.nextPageToken;
  } while (pageToken);
  return files;
}

const isMarkdown = (name, mime) =>
  mime === 'text/markdown' || CONFIG.EXTENSIONS.some((ext) => name.toLowerCase().endsWith(ext));

// Percorre a pasta e todas as subpastas (inclusive atalhos), nível por nível
async function walk(rootId, onCount) {
  const found = [];
  const seen = new Set([rootId]);
  let level = [{ id: rootId, path: '' }];
  while (level.length) {
    const nextLevel = [];
    await pool(level, CONFIG.CONCURRENCY, async (folder) => {
      for (const f of await listChildren(folder.id)) {
        let id = f.id, mime = f.mimeType, viaShortcut = false;
        if (mime === SHORTCUT && f.shortcutDetails) {
          id = f.shortcutDetails.targetId; mime = f.shortcutDetails.targetMimeType; viaShortcut = true;
        }
        if (seen.has(id)) continue;
        if (mime === FOLDER) {
          seen.add(id);
          nextLevel.push({ id, path: folder.path + f.name + '/' });
        } else if (isMarkdown(f.name, mime)) {
          seen.add(id);
          found.push({ id, name: f.name, path: folder.path, modifiedTime: viaShortcut ? null : f.modifiedTime });
        }
      }
      onCount(found.length);
    });
    level = nextLevel;
  }
  return found;
}

/* ---------- indexação ---------- */
function makeDoc(f, content) {
  const folded = fold(content);
  return {
    id: f.id, name: f.name, path: f.path, modifiedTime: f.modifiedTime,
    content, fold: folded, foldName: fold(f.path + f.name),
    refs: extractRefs(content, folded), times: extractTimes(content), video: findVideo(f.name, content)
  };
}

function setDocs(docs) {
  docs.sort((a, b) => (a.path + a.name).localeCompare(b.path + b.name, 'pt-BR'));
  state.docs = docs;
  state.citeCount = docs.reduce((n, d) => n + new Set(d.refs.map((r) => r.start)).size, 0);
  fillFolders();
  $('#cit-open').disabled = !docs.length;
}

const baseStatus = () =>
  `${plural(state.docs.length, 'arquivo', 'arquivos')} · ${plural(state.citeCount, 'citação bíblica', 'citações bíblicas')}`;

// Abre na hora com o índice salvo neste navegador
async function loadSnapshot() {
  const snap = await store.getMeta('lista');
  if (!snap?.files?.length) return;
  setStatus('Abrindo o índice salvo…');
  const recs = new Map(((await store.all()) || []).map((r) => [r.id, r]));
  const docs = [];
  for (const f of snap.files) { const r = recs.get(f.id); if (r) docs.push(makeDoc(f, r.content)); }
  if (!docs.length) return;
  setDocs(docs);
  const when = new Date(snap.savedAt).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  setStatus(`${baseStatus()} · salvo em ${when}`);
  renderResults();
}

async function buildIndex() {
  if (state.indexing) return;
  state.indexing = true;
  $('#refresh').disabled = true;
  const bg = state.docs.length > 0;          // já há resultados na tela: atualiza sem atrapalhar
  const prefix = () => (bg ? baseStatus() + ' · ' : '');
  try {
    setStatus(bg ? prefix() + 'verificando novidades no Drive…' : 'Procurando arquivos…');
    const files = await walk(CONFIG.ROOT_FOLDER_ID, (n) => setStatus(bg
      ? `${prefix()}verificando o Drive… ${plural(n, 'arquivo encontrado', 'arquivos encontrados')}`
      : `Procurando arquivos… ${plural(n, 'encontrado', 'encontrados')}`));

    const old = new Map(state.docs.map((d) => [d.id, d]));
    const recs = new Map(((await store.all()) || []).map((r) => [r.id, r]));
    const docs = [], toFetch = [];
    for (const f of files) {
      const o = old.get(f.id), r = recs.get(f.id);
      if (f.modifiedTime && o && o.modifiedTime === f.modifiedTime) {
        docs.push(o.path === f.path && o.name === f.name ? o : { ...o, name: f.name, path: f.path, foldName: fold(f.path + f.name) });
      } else if (f.modifiedTime && r && r.modifiedTime === f.modifiedTime) {
        docs.push(makeDoc(f, r.content));
      } else {
        toFetch.push(f);
      }
    }

    let done = 0, failed = 0, changed = 0;
    if (toFetch.length) setProgress(0, toFetch.length);
    await pool(toFetch, CONFIG.CONCURRENCY, async (f) => {
      const o = old.get(f.id);
      try {
        const content = await driveFetch(`${DRIVE}/files/${f.id}?alt=media&supportsAllDrives=true`, true);
        store.put({ id: f.id, modifiedTime: f.modifiedTime, content });
        if (o && o.content === content) docs.push({ ...o, name: f.name, path: f.path, foldName: fold(f.path + f.name) });
        else { docs.push(makeDoc(f, content)); changed++; }
      } catch (e) {
        failed++;
        console.warn('Não foi possível baixar', f.path + f.name, e);
        const r = recs.get(f.id);
        if (o) docs.push(o); else if (r) docs.push(makeDoc(f, r.content));   // mantém a versão salva
      }
      done++;
      setProgress(done, toFetch.length);
      setStatus(bg ? `${prefix()}baixando ${done} de ${toFetch.length}…` : `Lendo arquivos… ${done} de ${toFetch.length}`);
    });

    const keep = new Set(files.map((f) => f.id));
    const removed = bg ? [...old.keys()].filter((id) => !keep.has(id)).length : 0;
    setDocs(docs);
    store.putMeta('lista', {
      files: files.map(({ id, name, path, modifiedTime }) => ({ id, name, path, modifiedTime })),
      savedAt: Date.now()
    });
    store.prune(keep);

    const news = [];
    if (bg && changed) news.push(plural(changed, 'novo ou alterado', 'novos ou alterados'));
    if (removed) news.push(plural(removed, 'removido', 'removidos'));
    setProgress(null);
    setStatus(baseStatus() +
      (bg ? ` · ${news.length ? news.join(', ') : 'tudo em dia'}` : '') +
      (failed ? ` · ${plural(failed, 'não pôde ser lido', 'não puderam ser lidos')} (veja o console)` : ''));
    renderResults();
    if ($('#citations').open) renderCitations();
  } catch (e) {
    setProgress(null);
    setStatus(prefix() + explainError(e), { error: true });
  } finally {
    state.indexing = false;
    $('#refresh').disabled = false;
  }
}

function explainError(e) {
  if (e.status === 403 || e.status === 404) {
    return accessToken
      ? `Sua conta não tem acesso a esta pasta (${e.message}).`
      : `A pasta não está acessível pela chave de API. Confira se ela está compartilhada como "Qualquer pessoa com o link", se a Drive API está ativada e se a chave permite este domínio. (${e.message})`;
  }
  if (e.status === 400) return `Requisição recusada pelo Drive: confira o ID da pasta e a chave de API. (${e.message})`;
  if (e.status === 401) return 'Sua sessão expirou. Entre com Google de novo.';
  return `Erro ao acessar o Drive: ${e.message}`;
}

/* ---------- busca ---------- */
// O texto digitado é buscado como frase, na ordem (aspas não são necessárias).
// phrase = false devolve as palavras soltas, usadas quando a frase exata não aparece.
function parseQuery(q, phrase = true) {
  const clean = fold(q.replace(/["“”]/g, ' ')).trim().replace(/\s+/g, ' ');
  if (!clean) return [];
  return phrase ? [clean] : [...new Set(clean.split(' '))];
}

// Entre as palavras de uma frase aceita espaços, quebras de linha
// e a marcação de tempo de uma legenda nova (SRT/VTT).
const escRe = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const GAP = '(?:\\s*\\n\\s*(?:\\d+\\s*\\n\\s*)?\\d{1,2}:\\d{2}:\\d{2}[.,]\\d{1,3}\\s*-->[^\\n]*\\n\\s*|\\s+)';
const phraseRe = new Map();

// Ocorrências do termo como [posição, tamanho]; com "palavra inteira",
// só onde ele não está grudado em outras letras
function termPositions(hay, t, whole, limit = Infinity) {
  const out = [];
  const wStart = whole && isW(t.charCodeAt(0));
  const wEnd = whole && isW(t.charCodeAt(t.length - 1));
  const ok = (i, len) => !(wStart && isW(hay.charCodeAt(i - 1))) && !(wEnd && isW(hay.charCodeAt(i + len)));
  if (t.includes(' ')) {
    let re = phraseRe.get(t);
    if (!re) phraseRe.set(t, (re = new RegExp(t.split(' ').map(escRe).join(GAP), 'g')));
    re.lastIndex = 0;
    let m;
    while (out.length < limit && (m = re.exec(hay))) {
      if (ok(m.index, m[0].length)) out.push([m.index, m[0].length]);
      else re.lastIndex = m.index + 1;
    }
    return out;
  }
  let i = hay.indexOf(t);
  while (i !== -1 && out.length < limit) {
    const good = ok(i, t.length);
    if (good) out.push([i, t.length]);
    i = hay.indexOf(t, good ? i + t.length : i + 1);
  }
  return out;
}

function search(terms, ref, o) {
  const results = [];
  const browse = !terms.length && !ref;
  if (browse && !o.folder) return { terms, results, browse };
  for (const doc of state.docs) {
    if (!inFolder(doc, o.folder)) continue;
    let score = 0, count = 0;
    const hits = [], spans = [];
    if (ref) {
      for (const r of doc.refs) {
        if (refMatches(r, ref) && !spans.some((s) => s[0] === r.start)) spans.push([r.start, r.end]);
      }
      if (!spans.length) continue;
      count += spans.length;
      score += spans.length * 5;
      for (const [s, e] of spans.slice(0, 20)) hits.push([s, e - s]);
    }
    let ok = true;
    for (const t of terms) {
      const pos = termPositions(doc.fold, t, o.whole, 1000);
      const inName = termPositions(doc.foldName, t, o.whole, 1).length > 0;
      if (!pos.length && !inName) { ok = false; break; }
      count += pos.length;
      score += pos.length + (inName ? 25 : 0);
      for (const h of pos.slice(0, 20)) hits.push(h);
    }
    if (!ok) continue;
    results.push({ doc, score, count, hits, spans });
  }
  const byName = (a, b) => (a.doc.path + a.doc.name).localeCompare(b.doc.path + b.doc.name, 'pt-BR');
  if (browse) results.sort(byName);
  else results.sort((a, b) => b.score - a.score || byName(a, b));
  return { terms, results, browse };
}

// Marca termos (amarelo) e trechos de citação (azul). spans: [início, fim] relativos a "original"
function highlight(original, folded, terms, spans = []) {
  const kind = new Uint8Array(original.length);
  for (const [s, e] of spans) kind.fill(2, Math.max(0, s), Math.min(original.length, e));
  for (const t of terms) for (const [i, len] of termPositions(folded, t, state.whole)) kind.fill(1, i, i + len);
  let out = '', cur = 0;
  for (let i = 0; i < original.length; i++) {
    const k = kind[i];
    if (k !== cur) {
      if (cur) out += '</mark>';
      if (k) out += k === 2 ? '<mark class="ref">' : '<mark>';
      cur = k;
    }
    out += ESC[original[i]] || original[i];
  }
  return out + (cur ? '</mark>' : '');
}

function snippets(r, terms) {
  const { doc } = r, radius = 80, ranges = [];
  for (const [p, len] of [...r.hits].sort((a, b) => a[0] - b[0])) {
    const s = Math.max(0, p - radius), e = Math.min(doc.content.length, p + len + radius);
    const last = ranges[ranges.length - 1];
    if (last && s <= last[1]) last[1] = Math.max(last[1], e);
    else { if (ranges.length === CONFIG.SNIPPETS_PER_FILE) break; ranges.push([s, e, p]); }
  }
  return ranges.map(([s, e, p]) => {
    const spans = r.spans.filter(([a, b]) => b > s && a < e).map(([a, b]) => [a - s, b - s]);
    const t = timeAt(doc, p);
    return (t ? `<span class="time" title="Momento aproximado no vídeo">${t}</span>` : '') +
      (s > 0 ? '…' : '') + highlight(doc.content.slice(s, e), doc.fold.slice(s, e), terms, spans) +
      (e < doc.content.length ? '…' : '');
  });
}

function syncUrl(q, ref, o) {
  const p = new URLSearchParams();
  if (q.trim()) p.set('q', q);
  if (ref) {
    p.set('livro', ref.b);
    if (ref.c && BOOKS[ref.b - 1][1] > 1) p.set('cap', ref.c);
    if (ref.v) p.set('vers', ref.v);
  }
  if (o.folder) p.set('pasta', o.folder);
  if (o.whole) p.set('inteira', '1');
  const s = p.toString();
  history.replaceState(null, '', s ? `${location.pathname}?${s}` : location.pathname);
}

// Se a busca de texto for só uma referência ("jo 3:16"), oferece buscar como texto bíblico
function renderHint(q, ref) {
  const hint = $('#hint');
  hint.hidden = true;
  state.hintRef = null;
  const t = q.trim();
  if (!t || ref) return;
  const found = extractRefs(t, fold(t), { lenient: true });
  if (!found.length || found[0].start !== 0 || found[found.length - 1].end !== t.length) return;
  const r = found[0];
  state.hintRef = { b: r.b, c: r.c, v: r.v1 };
  hint.innerHTML = `<button class="link" type="button" id="hint-go">Buscar ${esc(refLabel(state.hintRef))} como texto bíblico</button>, ` +
    'para achar também abreviações e intervalos (como “Jo 3:14-18”).';
  hint.hidden = false;
}

function renderResults() {
  const q = $('#q').value;
  const ref = currentRef();
  const o = opts();
  state.whole = o.whole;
  state.ref = ref;
  syncUrl(q, ref, o);
  renderHint(q, ref);

  const list = $('#results'), summary = $('#summary');
  if (!q.trim() && !ref && !o.folder) {
    list.innerHTML = '';
    summary.textContent = '';
    return;
  }
  if (ref && ref.c > BOOKS[ref.b - 1][1]) {
    list.innerHTML = '';
    summary.textContent = `${BOOKS[ref.b - 1][0]} tem ${plural(BOOKS[ref.b - 1][1], 'capítulo', 'capítulos')}.`;
    return;
  }
  if (!state.docs.length) {
    list.innerHTML = '';
    summary.textContent = state.indexing ? 'A busca começa assim que a leitura terminar.' : '';
    return;
  }
  let { terms, results, browse } = search(parseQuery(q), ref, o);
  // Sem a frase exata: mostra os arquivos que têm todas as palavras, em qualquer ordem
  const words = parseQuery(q, false);
  let loose = false;
  if (!results.length && words.length > 1) {
    const r2 = search(words, ref, o);
    if (r2.results.length) { ({ terms, results } = r2); loose = true; }
  }
  state.results = results; state.terms = terms;
  const total = results.reduce((n, r) => n + r.count, 0);
  const label = ref ? refLabel(ref) : '';
  const more = results.length > CONFIG.MAX_RESULTS ? ` (mostrando os ${CONFIG.MAX_RESULTS} primeiros)` : '';
  let text;
  if (browse) {
    text = `${plural(results.length, 'arquivo', 'arquivos')} nesta pasta${more}.`;
  } else if (loose) {
    text = `Nenhum arquivo tem a frase exata “${q.trim().replace(/["“”]/g, '')}”. ` +
      `Mostrando ${plural(results.length, 'arquivo', 'arquivos')} com todas as palavras, em qualquer ordem${more}.`;
  } else if (results.length) {
    text = plural(results.length, 'arquivo', 'arquivos') + (total ? `, ${plural(total, 'ocorrência', 'ocorrências')}` : ' (termo encontrado no nome)') +
      more + '.';
  } else if (ref && !terms.length) {
    text = `Nenhum arquivo ${o.folder ? 'desta pasta ' : ''}cita ${label}.` +
      (ref.v && BOOKS[ref.b - 1][1] > 1 ? ' Tente apagar o versículo para ver o capítulo inteiro.' : '');
  } else {
    const tips = [];
    if (o.whole) tips.push('desmarcar “Palavra inteira”');
    if (o.folder) tips.push('buscar em todas as pastas');
    if (words.length > 1) tips.push('usar menos palavras');
    text = `Nenhum arquivo contém ${words.length > 1 ? 'essas palavras' : 'essa palavra'}.` +
      (tips.length ? ` Tente ${tips.join(' ou ')}.` : '');
  }
  const link = ref && jwLink(ref);
  summary.innerHTML = esc(text) + (link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Ler ${esc(label)} no jw.org</a>` : '');

  list.innerHTML = results.slice(0, CONFIG.MAX_RESULTS).map((r, i) => `
    <li><button class="result" data-i="${i}">
      <span class="path">${esc(r.doc.path || '/')}</span>
      <span class="name">${highlight(r.doc.name, fold(r.doc.name), terms)}${r.count ? `<span class="count">${plural(r.count, 'ocorrência', 'ocorrências')}</span>` : ''}</span>
      ${snippets(r, terms).map((s) => `<span class="snippet">${s}</span>`).join('')}
    </button>${r.doc.video ? `<a class="watch" href="${esc(r.doc.video)}" target="_blank" rel="noopener">Assistir no jw.org</a>` : ''}</li>`).join('');
}

/* ---------- visualização do arquivo ---------- */
function openViewer(r) {
  const { doc } = r;
  $('#viewer-path').textContent = doc.path || '/';
  $('#viewer-title').textContent = doc.name;
  $('#viewer-open').href = `https://drive.google.com/file/d/${doc.id}/view`;
  const watch = $('#viewer-watch');
  watch.hidden = !doc.video;
  if (doc.video) watch.href = doc.video;
  const article = $('#doc');
  if (window.marked && window.DOMPurify) {
    article.innerHTML = DOMPurify.sanitize(marked.parse(doc.content));
  } else {
    article.innerHTML = `<pre>${esc(doc.content)}</pre>`;
  }
  article.querySelectorAll('a[href]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });
  markTextNodes(article, state.terms, state.ref);
  $('#viewer').showModal();
  $('#viewer').scrollTop = 0;
  const first = article.querySelector('mark');
  if (first) first.scrollIntoView({ block: 'center' });
}

function markTextNodes(root, terms, ref) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.nodeValue, folded = fold(text);
    const spans = ref
      ? extractRefs(text, folded).filter((x) => refMatches(x, ref)).map((x) => [x.start, x.end])
      : [];
    if (!spans.length && !terms.some((t) => termPositions(folded, t, state.whole, 1).length)) continue;
    const span = document.createElement('span');
    span.innerHTML = highlight(text, folded, terms, spans);
    node.replaceWith(...span.childNodes);
  }
}

/* ---------- painel "Textos citados" ---------- */
function citationData(docs) {
  const verse = new Map(), chap = new Map(), book = new Map();
  const add = (m, k, di) => { let s = m.get(k); if (!s) m.set(k, (s = new Set())); s.add(di); };
  docs.forEach((d, di) => {
    for (const r of d.refs) {
      add(book, r.b, di);
      for (let c = r.c; c <= r.c2; c++) add(chap, `${r.b}:${c}`, di);
      if (r.v1) for (let v = r.v1; v <= Math.min(r.v2, r.v1 + 40); v++) add(verse, `${r.b}:${r.c}:${v}`, di);
    }
  });
  return { verse, chap, book };
}

function renderCitations() {
  const o = opts();
  const docs = state.docs.filter((d) => inFolder(d, o.folder));
  $('#cit-scope').textContent = o.folder ? o.folder.slice(0, -1).replace(/\//g, ' / ') : 'Todas as pastas';
  for (const b of document.querySelectorAll('#citations [data-view]')) {
    b.setAttribute('aria-pressed', String(b.dataset.view === state.citView));
  }
  const body = $('#cit-body');
  const { verse, chap, book } = citationData(docs);
  if (!book.size) {
    body.innerHTML = '<p class="note">Nenhuma citação bíblica foi reconhecida nestes arquivos.</p>';
    return;
  }

  if (state.citView === 'top') {
    const rows = [...verse].map(([k, s]) => { const [b, c, v] = k.split(':').map(Number); return { b, c, v, n: s.size }; })
      .sort((x, y) => y.n - x.n || x.b - y.b || x.c - y.c || x.v - y.v)
      .slice(0, CONFIG.TOP_CITATIONS);
    if (!rows.length) {
      body.innerHTML = '<p class="note">Só há citações de capítulos inteiros. Veja a lista por livro.</p>';
      return;
    }
    const max = rows[0].n;
    body.innerHTML = `<p class="note">Os versículos citados em mais arquivos. Escolha um para ver onde aparece.</p><ol class="top">` +
      rows.map((r) => `<li><button class="row" type="button" data-b="${r.b}" data-c="${r.c}" data-v="${r.v}">` +
        `<span>${esc(refLabel(r))}</span><span class="n">${plural(r.n, 'arquivo', 'arquivos')}</span>` +
        `<span class="meter" style="--w:${Math.max(2, Math.round((r.n / max) * 100))}%"></span></button></li>`).join('') +
      '</ol>';
    return;
  }

  const chaps = new Map(), verses = new Map();
  for (const [k, s] of chap) {
    const [b, c] = k.split(':').map(Number);
    if (!chaps.has(b)) chaps.set(b, []);
    chaps.get(b).push([c, s.size]);
  }
  for (const [k, s] of verse) {
    const [b, c, v] = k.split(':').map(Number), key = `${b}:${c}`;
    if (!verses.has(key)) verses.set(key, []);
    verses.get(key).push([v, s.size]);
  }
  body.innerHTML = '<p class="note">Os números pequenos mostram em quantos arquivos cada texto aparece.</p>' +
    [...book.keys()].sort((a, b) => a - b).map((b) => {
      const one = BOOKS[b - 1][1] === 1;
      const inner = chaps.get(b).sort((x, y) => x[0] - y[0]).map(([c, n]) => {
        const vs = (verses.get(`${b}:${c}`) || []).sort((x, y) => x[0] - y[0]);
        const head = `<button class="chip strong" type="button" data-b="${b}" data-c="${c}" aria-label="${esc(refLabel({ b, c }))}, ${plural(n, 'arquivo', 'arquivos')}">${one ? 'Todos' : `Cap. ${c}`}<small>${n}</small></button>`;
        return `<div class="chap">${head}${vs.map(([v, m]) =>
          `<button class="chip" type="button" data-b="${b}" data-c="${c}" data-v="${v}" aria-label="${esc(refLabel({ b, c, v }))}, ${plural(m, 'arquivo', 'arquivos')}">${v}<small>${m}</small></button>`).join('')}</div>`;
      }).join('');
      return `<details><summary>${esc(BOOKS[b - 1][0])}<span class="n">${plural(book.get(b).size, 'arquivo', 'arquivos')}</span></summary><div class="chaps">${inner}</div></details>`;
    }).join('');
}

/* ---------- login (só para pastas privadas) ---------- */
function loadGoogleIdentity() {
  return new Promise((res, rej) => {
    if (window.google?.accounts?.oauth2) return res();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = res;
    s.onerror = () => rej(new Error('Não foi possível carregar o login do Google.'));
    document.head.appendChild(s);
  });
}
async function signIn() {
  try {
    await loadGoogleIdentity();
    google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/drive.readonly',
      callback: (resp) => {
        if (resp.error) return setStatus('Login cancelado ou recusado.', { error: true });
        accessToken = resp.access_token;
        $('#login').hidden = true;
        buildIndex();
      }
    }).requestAccessToken();
  } catch (e) { setStatus(e.message, { error: true }); }
}

/* ---------- início ---------- */
let timer;
const later = () => { clearTimeout(timer); timer = setTimeout(renderResults, 150); };
$('#q').addEventListener('input', later);
$('#book').addEventListener('change', () => {
  const b = +$('#book').value;
  if (b && +$('#chapter').value > BOOKS[b - 1][1]) $('#chapter').value = '';
  if (b && BOOKS[b - 1][1] > 1 && $('#chapter').value === '1' && $('#chapter').disabled) $('#chapter').value = '';
  syncRefFields();
  renderResults();
  if (!$('#chapter').disabled) $('#chapter').focus();
  else if (!$('#verse').disabled) $('#verse').focus();
});
for (const id of ['#chapter', '#verse']) {
  $(id).addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3);
    syncRefFields();
    later();
  });
}
for (const id of ['#folder', '#whole']) $(id).addEventListener('change', renderResults);
$('#ref-clear').addEventListener('click', () => { setRef({}); renderResults(); $('#book').focus(); });
$('#hint').addEventListener('click', (e) => {
  if (!e.target.closest('#hint-go') || !state.hintRef) return;
  setRef(state.hintRef);
  $('#q').value = '';
  renderResults();
});
$('#results').addEventListener('click', (e) => {
  const btn = e.target.closest('.result');
  if (btn) openViewer(state.results[+btn.dataset.i]);
});
$('#viewer-close').addEventListener('click', () => $('#viewer').close());
for (const d of ['#viewer', '#citations']) {
  $(d).addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });
}
$('#cit-open').addEventListener('click', () => {
  renderCitations();
  $('#citations').showModal();
  $('#citations').scrollTop = 0;
});
$('#cit-close').addEventListener('click', () => $('#citations').close());
$('#citations').addEventListener('click', (e) => {
  const view = e.target.closest('[data-view]');
  if (view) { state.citView = view.dataset.view; renderCitations(); $('#citations').scrollTop = 0; return; }
  const pick = e.target.closest('[data-b]');
  if (!pick) return;
  setRef({ b: +pick.dataset.b, c: +pick.dataset.c || 0, v: +pick.dataset.v || 0 });
  $('#citations').close();
  renderResults();
  window.scrollTo({ top: 0 });
});
$('#refresh').addEventListener('click', buildIndex);
$('#login').addEventListener('click', signIn);
document.addEventListener('keydown', (e) => {
  const typing = e.target.closest?.('input, select, textarea');
  const modal = $('#viewer').open || $('#citations').open;
  if (e.key === '/' && !typing && !modal) { e.preventDefault(); $('#q').focus(); }
});

(async function init() {
  fillBooks();
  const p = new URLSearchParams(location.search);
  $('#q').value = p.get('q') || '';
  const b = parseInt(p.get('livro'), 10);
  if (b >= 1 && b <= 66) setRef({ b, c: parseInt(p.get('cap'), 10) || 0, v: parseInt(p.get('vers'), 10) || 0 });
  else syncRefFields();
  state.pendingFolder = p.get('pasta') || '';
  $('#whole').checked = p.get('inteira') === '1';

  if (!CONFIG.ROOT_FOLDER_ID || CONFIG.ROOT_FOLDER_ID.startsWith('COLE_')) {
    return setStatus('Preencha ROOT_FOLDER_ID no bloco CONFIG do index.html.', { error: true });
  }
  if (!CONFIG.CLIENT_ID && (!CONFIG.API_KEY || CONFIG.API_KEY.startsWith('COLE_'))) {
    return setStatus('Preencha API_KEY (ou CLIENT_ID) no bloco CONFIG do index.html.', { error: true });
  }

  await loadSnapshot();
  if (CONFIG.CLIENT_ID) {
    $('#login').hidden = false;
    $('#refresh').disabled = true;
    return setStatus((state.docs.length ? baseStatus() + ' · ' : '') + 'Entre com sua conta Google para buscar novidades.');
  }
  buildIndex();
})();
</script>

<script>
/* ---------- Botão de tema claro/escuro ---------- */
(function () {
  const btn = document.getElementById('theme');
  const root = document.documentElement;
  const media = matchMedia('(prefers-color-scheme: dark)');
  const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : media.matches;

  function render() {
    const dark = isDark();
    btn.innerHTML = dark ? sun + 'Modo claro' : moon + 'Modo escuro';
    btn.setAttribute('aria-label', dark ? 'Mudar para o modo claro' : 'Mudar para o modo escuro');
  }

  btn.addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('tema', next); } catch (e) {}
    render();
  });
  media.addEventListener('change', render);
  render();
})();
</script>
